<style>
  :root{
    /* Pure white, sampled off dirtverse's live hero rather than read out of
       their stylesheet — the #f2f2ef token in there never paints the page.
       Like theirs, this page stays in one light world and carries no dark
       theme: the orbs are lit for a bright room. */
    --paper:  #FFFFFF;
    --ink:    #0A0A0A;
    --pill:   #F0F0F0;
    --pill-in:#48484A;
    --title-ink:#E4E4E7;   /* tunnel titles: a soft grey watermark the orbs sit in front of */
    /* the carousel, in one place */
    --r: 800px;          /* measured off dirtverse's settled ring: 1.5x the orb */
  }

  *{ box-sizing:border-box; margin:0; padding:0 }
  html,body{ height:100% }
  body{ background:var(--paper); color:var(--ink);
        font-family:Archivo,system-ui,sans-serif; overflow:hidden }

  /* ---------- chrome ---------- */
  .bar{
    position:fixed; inset:0 0 auto 0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px; pointer-events:none;
  }
  .bar > *{ pointer-events:auto }
  .nav{ display:flex; gap:9px }
  .nav a,.contact{ font-size:14px; font-weight:500; text-decoration:none;
                   padding:7px 17px; border-radius:999px; white-space:nowrap }
  .nav a{ background:var(--pill); color:var(--pill-in) }
  .nav a:hover{ color:var(--ink) }
  .contact{ background:var(--ink); color:var(--paper) }
  /* true page centre, not the gap between the unequal nav and contact pills */
  .brand{ font-weight:900; font-stretch:125%; font-size:19px; letter-spacing:-.04em; white-space:nowrap;
          position:absolute; left:50%; transform:translateX(-50%) }
  @media (max-width:820px){ .brand{ position:static; transform:none } }
  .nav a:focus-visible,.contact:focus-visible,.scene:focus-visible{
    outline:2px solid var(--ink); outline-offset:3px }

  /* ---------- the carousel ---------- */
  .scene{
    position:fixed; inset:0;
    touch-action:none; user-select:none; -webkit-user-select:none;
    cursor:grab; overflow:hidden;
    isolation:isolate;                   /* own stacking context: titles can sit behind the orbs */
  }
  .scene[data-drag="1"]{ cursor:grabbing }
  /* No shared 3D context on purpose. Each slot carries its own perspective()
     in JS, so Chrome never depth-sorts the orbs by slicing them along each
     other's planes — that slicing is what cut orbs clean down the middle. */
  .tilt{ position:absolute; inset:0 }
  /* dirtverse's carousel section is the viewport less a 104.6px strip at the
     bottom, with the ring dead centre of it */
  .ring{ position:absolute; left:50%; top:calc((100% - 104.6px) / 2); width:0; height:0 }

  /* each slot: JS writes the whole projection, pivoting on the ring centre */
  .slot{
    position:absolute; left:0; top:0;
    transform-origin:0 0;
    will-change:transform;
    opacity:0; transition:opacity .6s cubic-bezier(0,0,.58,1);
  }
  .slot.in{ opacity:1 }
  .slot__f{ position:relative; animation:float var(--dur) var(--delay) ease-in-out infinite }
  @keyframes float{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-10px) } }


  /* A video face sizes like an image face. max-width matters: a host
     stylesheet's video{max-width:100%} resolves against the zero-width .ring
     and collapses it — the same trap that rules out <img> here. */
  /* clip each clip to its disc: its white square corners would otherwise paint over
     the watermark titles running behind the orbs (disc edge is 39.9% of the frame) */
  .orbvid{ max-width:none; object-fit:contain; background:none; clip-path:circle(39.5% at 50% 50%) }

  .orbimg{
    width:533.333px; height:533.333px; /* dirtverse's orb size */
    margin:-266.667px 0 0 -266.667px;  /* centre the orb on its slot origin */
    background-size:contain; background-repeat:no-repeat; background-position:center;
    display:block; pointer-events:none; position:relative;
    backface-visibility:hidden;        /* far half of the ring drops out cleanly */
  }


  /* ---------- linked orbs ---------- */
  /* An orb with data-href is a door. It takes the pointer back (the disc only,
     thanks to the clip-path), so a tap on it opens its page while a drag that
     starts on it still turns the ring: the scene sees the same pointerdown. */
  .orbvid[data-href]{ pointer-events:auto; cursor:pointer; transition:transform .45s cubic-bezier(.2,.7,.2,1) }
  .orbvid[data-href]:hover{ transform:scale(1.035) }
  .scene[data-drag="1"] .orbvid[data-href]{ cursor:grabbing; transform:none }
  /* the bloom: the orb's own colour grows out of it until it owns the screen,
     then the next page opens under the same colour and lets it fade */
  .wipe{
    position:fixed; inset:0; z-index:30; pointer-events:none;
    transition:clip-path .72s cubic-bezier(.7,0,.2,1);
    will-change:clip-path;
  }

  /* ---------- section titles: a tunnel behind the orbs ---------- */
  /* The title is part of the background. Its words are split across two giant
     lines, one on the tunnel's ceiling above the orbs and one on its floor
     below them, each leaning back toward the middle of the screen where the
     orbs float, so the lettering runs far back into the distance. It is set in
     one flat soft grey, a watermark the orbs lead in front of. JS sizes each line to the
     screen; on a handover the titles cross-fade where they stand, never moving. */
  .titles{
    position:absolute; inset:0; z-index:-1;   /* behind the orbs, inside the scene */
    pointer-events:none; opacity:0; transition:opacity .6s cubic-bezier(0,0,.58,1);
  }
  .titles.in{ opacity:1 }
  .sr-only{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; border:0;
            overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }
  .title{ position:absolute; inset:0; opacity:0; will-change:opacity }
  .title__line{
    position:absolute; left:50%; white-space:nowrap;
    font-family:Archivo, system-ui, sans-serif;   /* Archivo Black: the header's family at full weight */
    font-weight:900; font-stretch:62%; line-height:1; text-transform:uppercase;   /* Archivo at its narrowest: skinny letters */
    letter-spacing:.08em; padding-left:.08em;   /* spread out; the padding balances the tracking after the last letter */
    color:var(--title-ink);
  }
  /* ceiling: pinned by its top edge, its lower edge running back into the tunnel */
  .title__line--top{
    transform-origin:50% 0%;
  }
  /* floor: pinned by its bottom edge, its upper edge running back into the tunnel */
  .title__line--bot{
    transform-origin:50% 100%;
  }

  .foot{
    position:fixed; left:0; right:0; bottom:18px; z-index:10;
    display:flex; justify-content:center; align-items:center; gap:14px;
    font-size:11px; font-weight:500; letter-spacing:.24em; text-transform:uppercase;
    color:var(--pill-in); pointer-events:none;
  }
  @media (max-width:820px){
    :root{ --r:540px }   /* same 1.5x ratio to the smaller orb */
    .orbimg{ width:360px; height:360px; margin:-180px 0 0 -180px }
  }
  @media (max-width:700px){
    .nav a,.contact{ font-size:13px; padding:6px 13px } .nav{ gap:6px }
  }
  @media (prefers-reduced-motion: reduce){
    .slot__f{ animation:none }
    .slot{ transition:none }
  }

  /* ---------- opening: the wordmark clip, then the page ---------- */
  .intro{
    position:fixed; inset:0; z-index:20; background-color:var(--paper);
    display:grid; place-items:center;
    transition:opacity .6s cubic-bezier(.4,0,.2,1), background-color .7s ease;
  }
  .intro.out{ opacity:0; pointer-events:none }
  .intro.fly{ background-color:rgba(255,255,255,0); pointer-events:none }
  /* The clip is pure white to its edges (levels lifted on encode), so it sits
     on the page with no mask. Sized like dirtverse's own: about a third of
     the screen, never wider than the screen itself. */
  .intro video{ width:clamp(340px, 36vw, 760px); max-width:100vw; height:auto; display:block }
  /* the flight: a transparent cut of the clip's last frame, travelling from
     where the word sits in the video to where it sits in the header */
  .intro__mark{
    position:fixed; left:0; top:0; transform-origin:0 0; will-change:transform;
    transition:transform .9s cubic-bezier(.7,0,.2,1);
  }
  /* The header's "Ejay" is the intro's own wordmark artwork, like dirtverse's
     nav logo, so the flight lands on an exact copy. Sized off the cut-out:
     its E is 72.65% of the image height with the baseline 78.77% down, and
     Archivo's cap height is .69em, so .69 / .7265 = .95em tall, dropped by the
     21.2% that sits below the baseline. The two words then share a cap line
     and a baseline. */
  .brand__first{ height:.95em; width:auto; vertical-align:-.2016em; margin-right:.28em }
  .brand__rest{ transition:opacity .45s ease .05s }
  body.brand-wait .brand__first, body.brand-wait .brand__rest{ opacity:0; transition:none }
  .bar{ transition:opacity .6s .15s }
  body.intro-on .bar{ opacity:0 }
</style>


<div class="intro" id="intro" aria-hidden="true">
  <video id="intro-video" muted playsinline preload="auto" disablepictureinpicture
         poster="assets/intro/ejay-intro.jpg">
    <source src="assets/intro/ejay-intro.webm" type="video/webm">
    <source src="assets/intro/ejay-intro.mp4" type="video/mp4">
  </video>
  <img class="intro__mark" src="assets/intro/ejay-mark.png" alt="" hidden>
</div>

<script>
// Opening: a 2.5s clip of the wordmark growing glowing mould and pulling back
// clean, played once on a white cover that then fades to reveal the page. The
// poster is the clip's first frame, so the clean wordmark is up before any
// video has loaded. The live GPU version of this lives in _ref-test-intro-sim.html.
(() => {
  const intro = document.getElementById('intro');
  const video = document.getElementById('intro-video');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ intro.remove(); return; }
  // Play once per visit: coming back from an orb's page (the "Orbs" pill, or
  // the browser's back button) lands straight on the carousel.
  const SEEN = 'ejay-intro-seen';
  let seen = location.hash === '#orbs';   // the "Orbs" pill on an orb's page links here
  try { seen = seen || sessionStorage.getItem(SEEN) === '1'; sessionStorage.setItem(SEEN, '1'); } catch (e) {}
  if (seen){ intro.remove(); return; }
  window.introPending = true;
  document.body.classList.add('intro-on');

  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    intro.classList.add('out');
    document.body.classList.remove('intro-on');
    window.introPending = false;
    dispatchEvent(new Event('introdone'));
    setTimeout(() => intro.remove(), 700);
  };

  // The flight, as dirtverse does it: when the clip ends, the word lifts off
  // the white, shrinks, and lands as the header's first word while the page
  // comes up underneath. "Adamo" fades in beside it once it has landed.
  const mark = intro.querySelector('.intro__mark');
  // where the wordmark sits inside the frame, measured off the last frame
  const INK = { left: .1391, top: .2231, width: .7297, height: .6194 };

  const fly = () => {
    if (finished) return;
    finished = true;

    const v = video.getBoundingClientRect();
    const from = { x: v.left + INK.left * v.width, y: v.top + INK.top * v.height,
                   w: INK.width * v.width, h: INK.height * v.height };

    // landing box: the header's "Ejay" is this same artwork, cropped the
    // same way, so the flight lands exactly on its box
    document.body.classList.add('brand-wait');
    const to = document.querySelector('.brand__first').getBoundingClientRect();

    mark.style.width = from.w + 'px';
    mark.style.height = from.h + 'px';
    mark.style.transform = 'translate(' + from.x + 'px,' + from.y + 'px)';
    mark.hidden = false;
    video.style.visibility = 'hidden';
    intro.classList.add('fly');

    // the page comes up while the name travels
    document.body.classList.remove('intro-on');
    window.introPending = false;
    dispatchEvent(new Event('introdone'));

    requestAnimationFrame(() => requestAnimationFrame(() => {
      const s = to.height / from.h;   // same artwork, same aspect: height fixes width too
      mark.style.transform = 'translate(' + to.left + 'px,' + to.top + 'px) scale(' + s + ')';
    }));

    let landed = false;
    const land = () => {
      if (landed) return;
      landed = true;
      document.body.classList.remove('brand-wait');
      requestAnimationFrame(() => intro.remove());
    };
    mark.addEventListener('transitionend', land, { once: true });
    setTimeout(land, 1300);
  };

  video.addEventListener('ended', fly);
  // only the last <source> failing means nothing can play
  video.querySelector('source:last-of-type').addEventListener('error', finish);
  // never hold the page hostage: not moving within 1.5s, or not done by 5s.
  // Test the clock, not .paused: a play() stuck waiting for data isn't paused.
  setTimeout(() => { if (video.currentTime < 0.05) finish(); }, 1500);
  setTimeout(finish, 5000);
  const p = video.play();
  if (p) p.catch(finish);
})();
</script>

    <div class="slot" style="--i:5"><div class="slot__f"><video class="orbimg orbvid" src="assets/3d/_ref/premium.webm" poster="assets/3d/_ref/premium.webp" autoplay loop muted playsinline preload="auto" disablepictureinpicture aria-label="Red chrome blobs. Opens More about me." data-title="More about me" data-tint="#E84E52" data-href="about-me.html"></video></div></div>

    <div class="slot" style="--i:7"><div class="slot__f"><video class="orbimg orbvid" src="assets/3d/_ref/premium7.webm" poster="assets/3d/_ref/premium7.webp" autoplay loop muted playsinline preload="auto" disablepictureinpicture aria-label="Floating question mark. Opens What you should know." data-title="What you should know" data-tint="#D57594" data-href="know.html"></video></div></div>
    <div class="slot" style="--i:8"><div class="slot__f"><video class="orbimg orbvid" src="assets/3d/_ref/premium10.webm" poster="assets/3d/_ref/premium10.webp" autoplay loop muted playsinline preload="auto" disablepictureinpicture aria-label="Emerald chrome blobs. Opens My work." data-title="My work" data-tint="#609B61" data-href="work.html"></video></div></div>
    <div class="slot" style="--i:9"><div class="slot__f"><video class="orbimg orbvid" src="assets/3d/_ref/premium5.webm" poster="assets/3d/_ref/premium5.webp" autoplay loop muted playsinline preload="auto" disablepictureinpicture aria-label="Morphing faces" data-title="Testimonies" data-tint="#C89897"></video></div></div>
  </div>

<div class="foot">
  <span>Drag to slide &middot; Click an orb to open</span>
</div>

<script>
(() => {
  const scene = document.getElementById('scene');
  const slots = [...document.querySelectorAll('.slot')];
  const N     = slots.length;

  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const ring = document.getElementById('ring');

  // Section titles. Each orb clip carries its section in data-title (its twin
  // on the far side shares it). Only the orb at the front shows its title,
  // which rides above that orb and hands over to the next as the ring turns.
  const titleBox = document.createElement('div');
  titleBox.className = 'titles';
  scene.appendChild(titleBox);
  // the watermark is decorative-strength contrast, so the front section is also announced
  const titleLive = document.createElement('p');
  titleLive.className = 'sr-only';
  titleLive.setAttribute('aria-live', 'polite');
  scene.appendChild(titleLive);
  const slotTitle = slots.map(s => {
    const v = s.querySelector('video');
    return v ? v.dataset.title || '' : '';
  });
  // Split a title across the tunnel's ceiling and floor at the word break
  // that balances the two lines best; a single word keeps the ceiling alone.
  const splitTitle = name => {
    const words = name.split(' ');
    let best = [name, ''], gap = Infinity;
    for (let i = 1; i < words.length; i++){
      const top = words.slice(0, i).join(' '), bot = words.slice(i).join(' ');
      const d = Math.abs(top.length - bot.length);
      if (d < gap){ gap = d; best = [top, bot]; }
    }
    return best;
  };
  const titleEls = new Map();                     // title -> { el, lines, drawn }
  for (let k = 0; k < N; k++){
    const name = slotTitle[(N / 2 + k) % N];
    if (!name || titleEls.has(name)) continue;
    const el = document.createElement('div');
    el.className = 'title';
    const lines = [];
    const [topText, botText] = splitTitle(name);
    for (const [text, where] of [[topText, 'top'], [botText, 'bot']]){
      if (!text) continue;
      const node = document.createElement('span');
      node.className = 'title__line title__line--' + where;
      node.textContent = text;
      el.appendChild(node);
      lines.push({ node, where, text });
    }
    titleBox.appendChild(el);
    titleEls.set(name, { el, lines, drawn: '' });
  }

  // Chrome declines the autoplay attribute often enough that a video orb just
  // sits on its poster frame. Ask directly, and retry on first interaction.
  // Getting a video orb to actually run turns out to need belt and braces.
  // The autoplay attribute can be declined, a play() call can be rejected
  // before any data has arrived, and playbackRate is reset by some loads. So:
  // ask on every event that means "more is ready", and again on first input.
  const FACE_RATE = 1;            // full rate: the slow revolution is baked into the frames now
  const faces = [...document.querySelectorAll('video.orbvid')];
  const startFaces = () => faces.forEach(v => {
    if (v.dataset.culled === '1') return;   // far side of the ring: left paused on purpose
    v.playbackRate = FACE_RATE;
    const p = v.play();
    if (p) p.catch(() => {});
  });
  faces.forEach(v => {
    ['loadeddata', 'canplay', 'canplaythrough', 'stalled', 'suspend'].forEach(
      e => v.addEventListener(e, startFaces));
  });
  startFaces();
  addEventListener('pointerdown', startFaces);
  addEventListener('keydown', startFaces);
  document.addEventListener('visibilitychange', startFaces);

  // ?debug=1 turns the footer into a live readout of what the video is doing
  if (new URLSearchParams(location.search).get('debug') === '1'){
    const out = document.querySelector('.foot span');
    setInterval(() => {
      out.textContent = faces.map(v =>
        (v.paused ? 'PAUSED' : 'playing') +
        ' ready:' + v.readyState +
        ' t:' + v.currentTime.toFixed(1) +
        ' rate:' + v.playbackRate +
        ' size:' + v.videoWidth + 'x' + v.videoHeight +
        (v.error ? ' ERR:' + v.error.code : '')
      ).join(' | ') || 'no video faces';
    }, 250);
  }

  const STEP = 360 / N;

  // ── the dirtverse motion model ───────────────────────────────────────
  // Every constant below is lifted from their compiled Framer component, not
  // eyeballed. Three independent layers stack: a cursor tilt on the outside,
  // the drag spin in the middle, and a per-orb bob in CSS underneath.
  const SENS        = 0.5;    // rotation = rot0 - dx * SENS
  const ENTRY_DELAY = 0.25;   // seconds; their own site sits at 2.78, being below the fold
  const ARM_AFTER   = 1200;   // ms after the entrance before a drag is accepted
  const TILT_X      = 5;      // deg of rotateX, driven by cursor Y
  const TILT_Y      = 3;      // deg of rotateY, driven by cursor X
  const BOB_BASE    = 2.8;    // s, plus 0.08 per orb
  const BOB_STAGGER = 0.08;

  const coarse = matchMedia('(pointer: coarse)').matches;

  // framer-motion springs run at mass 1, so a = -k(x - target) - c*v.
  // All three are overdamped: 24 against a critical 2*sqrt(35) = 11.8. That
  // ratio, not the stiffness, is what makes the ring feel heavy and slow.
  const SPIN_SPRING   = coarse ? { k: 28, c: 22 } : { k: 35, c: 24 };
  const RADIUS_SPRING = coarse ? { k: 24, c: 18 } : { k: 30, c: 20 };
  const TILT_SPRING   = { k: 50, c: 18 };

  // the tilt rides outside the spin, so cursor parallax never fights the drag
  const tiltEl = document.createElement('div');
  tiltEl.className = 'tilt';
  ring.parentNode.insertBefore(tiltEl, ring);
  tiltEl.appendChild(ring);

  let R = 800;
  const readGeometry = () => {
    const r = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--r'));
    if (r) R = r;
  };
  readGeometry();

  const mk = (v, cfg) => ({ v, target: v, vel: 0, k: cfg.k, c: cfg.c });
  const advance = (s, dt) => {
    let t = dt;
    while (t > 0){                        // substep, so a dropped frame can't
      const h = Math.min(t, 1 / 240);     // blow the integrator up
      s.vel += (-s.k * (s.v - s.target) - s.c * s.vel) * h;
      s.v   += s.vel * h;
      t -= h;
    }
  };

  // entrance: the ring unspins 90deg while the radius collapses from 1.8x
  const spin  = mk(calm ? 180 : 270, SPIN_SPRING);
  const rad   = mk(calm ? R : R * 1.8, RADIUS_SPRING);
  const tiltX = mk(0, TILT_SPRING);
  const tiltY = mk(0, TILT_SPRING);

  // mismatched periods, not just staggered delays: the orbs drift out of phase
  // and never resync, which is the whole trick behind the organic feel
  slots.forEach((s, i) => {
    const f = s.querySelector('.slot__f');
    f.style.setProperty('--dur',   (BOB_BASE + i * BOB_STAGGER).toFixed(2) + 's');
    f.style.setProperty('--delay', (calm ? 0 : ENTRY_DELAY + 1.2 + i * BOB_STAGGER).toFixed(2) + 's');
  });

  let armed = calm;
  if (calm) { slots.forEach(s => s.classList.add('in')); titleBox.classList.add('in'); }
  else {
    const enter = () => {
      setTimeout(() => {
        spin.target = 180;
        rad.target  = R;
        { slots.forEach(s => s.classList.add('in')); titleBox.classList.add('in'); }
      }, ENTRY_DELAY * 1000);
      setTimeout(() => { armed = true; }, ENTRY_DELAY * 1000 + ARM_AFTER);
    };
    // the ring waits behind the opening name, then makes its entrance
    if (window.introPending) addEventListener('introdone', enter, { once: true });
    else enter();
  }

  // --- drag: no inertia, no snap ---------------------------------------
  // Their release handler genuinely does nothing. What reads as momentum is
  // only the spring still catching up to where your finger left the target.
  let dragging = false, x0 = 0, rot0 = 0;

  // --- a tap on a linked orb opens it -----------------------------------
  // Same pointerdown as the drag. If the pointer comes up within a few pixels
  // and a few hundred ms of where it went down, that was a click, not a turn.
  const TAP_SLOP = 8, TAP_MS = 500;
  let tap = null;                        // { el, x, y, t } while a press might still be a tap
  let leaving = false;

  const openOrb = el => {
    if (leaving || !el) return;
    leaving = true;
    const href = el.dataset.href, tint = el.dataset.tint || '#E84E52';
    try { sessionStorage.setItem('orb-arrive', tint); } catch {}
    const go = () => { location.href = href; };
    if (calm){ go(); return; }
    // grow the orb's colour out of the orb's disc until it covers the screen
    const b = el.getBoundingClientRect();
    const cx = b.left + b.width / 2, cy = b.top + b.height / 2;
    const r0 = Math.min(b.width, b.height) * 0.395;        // the disc edge in the clip
    const far = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy));
    const wipe = document.createElement('div');
    wipe.className = 'wipe';
    wipe.style.background = tint;
    wipe.style.clipPath = 'circle(' + r0.toFixed(1) + 'px at ' + cx.toFixed(1) + 'px ' + cy.toFixed(1) + 'px)';
    document.body.appendChild(wipe);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      wipe.style.clipPath = 'circle(' + (far + 24).toFixed(1) + 'px at ' + cx.toFixed(1) + 'px ' + cy.toFixed(1) + 'px)';
    }));
    wipe.addEventListener('transitionend', go, { once: true });
    setTimeout(go, 1000);                                   // never strand the click
  };
  // the orb nearest dead front, for the keyboard
  const frontOrb = () => {
    let best = -1, bestOff = Infinity;
    for (let i = 0; i < N; i++){
      const off = Math.abs(((spin.v - i * STEP) % 360 + 540) % 360 - 180);
      if (off < bestOff){ bestOff = off; best = i; }
    }
    const v = best >= 0 ? faces[best] : null;
    return v && v.dataset.href ? v : null;
  };

  scene.addEventListener('pointerdown', e => {
    if (!armed || leaving || e.target.closest('.bar') || e.target.closest('.foot')) return;
    const door = e.target.closest('.orbvid[data-href]');
    tap = door ? { el: door, x: e.clientX, y: e.clientY, t: performance.now() } : null;
    dragging = true; x0 = e.clientX; rot0 = spin.target;
    scene.setPointerCapture(e.pointerId);
    scene.dataset.drag = '1';
  });

  let rect = null, tiltRaf = 0;
  const dropRect = () => { rect = null; };
  addEventListener('scroll', dropRect, { passive: true });
  addEventListener('resize', () => {
    dropRect(); readGeometry();
    if (!dragging) rad.target = R;
  }, { passive: true });

  scene.addEventListener('pointermove', e => {
    if (dragging){
      spin.target = rot0 - (e.clientX - x0) * SENS;
      if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > TAP_SLOP) tap = null;   // it became a drag
      return;
    }
    if (calm || coarse || !armed || tiltRaf) return;
    const px = e.clientX, py = e.clientY;
    tiltRaf = requestAnimationFrame(() => {   // one cached rect read per frame
      tiltRaf = 0;
      if (!rect) rect = scene.getBoundingClientRect();
      tiltX.target = -(((py - rect.top)  / rect.height) * 2 - 1) * TILT_X;
      tiltY.target = -(((px - rect.left) / rect.width)  * 2 - 1) * TILT_Y;
    });
  });

  const release = e => {
    if (!dragging) return;
    dragging = false; scene.dataset.drag = '0';
    if (e && e.pointerId != null && scene.hasPointerCapture?.(e.pointerId))
      scene.releasePointerCapture(e.pointerId);
  };
  scene.addEventListener('pointerup', e => {
    const hit = tap && dragging &&
      Math.hypot(e.clientX - tap.x, e.clientY - tap.y) <= TAP_SLOP &&
      performance.now() - tap.t <= TAP_MS ? tap.el : null;
    tap = null;
    release(e);
    if (hit){ spin.target = rot0; openOrb(hit); }   // a tap turns nothing
  });
  scene.addEventListener('pointercancel', e => { tap = null; release(e); });
  scene.addEventListener('lostpointercapture', release);
  scene.addEventListener('pointerleave', e => {
    release(e);
    tiltX.target = 0; tiltY.target = 0;   // settle back to square
  });

  scene.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){
      const door = frontOrb();
      if (door){ openOrb(door); e.preventDefault(); }
      return;
    }
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    spin.target += (e.key === 'ArrowRight' ? -STEP : STEP);
    e.preventDefault();
  });

  // The camera sits inside the ring, so a slot swinging round past the side
  // comes up beside the viewer and projects enormous, and its opaque white
  // square can land over the orbs in front. A slot is hidden once its box is
  // fully off screen (or behind the camera), and its video paused.
  let faceHalf = faces[0] ? parseFloat(getComputedStyle(faces[0]).width) / 2 : 266.667;
  // dirtverse holds perspective at 1.5x the orb size: 800px on a 533px orb
  let PERSP = faceHalf * 3;
  addEventListener('resize', () => {
    if (faces[0]) faceHalf = parseFloat(getComputedStyle(faces[0]).width) / 2;
    PERSP = faceHalf * 3;
  }, { passive: true });
  const shown = slots.map(() => true);
  const drawn = slots.map(() => '');
  const depth = new Float64Array(N);
  const order = slots.map((_, i) => i);
  const zDrawn = new Int8Array(N).fill(-1);

  // Tunnel geometry. The letters are stretched long and skinny, and the two lines
  // lean differently: the ceiling a moderate lean, the floor a steep one seen from
  // close up, so its near (bottom) edge flares wide while its far edge pinches in
  // toward the orbs, like looking down into an abyss. The lines are a watermark
  // behind the orbs, so each may run in as far as the ring centre. Each line is
  // sized on its own: as tall as its band allows once stretched and foreshortened,
  // and never wider than 86% of the screen.
  const TUNNEL = {
    top: { tilt: 40, persp: 900 },
    bot: { tilt: 40, persp: 520 },   // gentle enough to reach the orbs without a huge stretched layer
  };
  const TUNNEL_STRETCH = 2.6;
  let announced = '';                                           // last title read out to screen readers
  const layoutTitles = () => {
    const vw = innerWidth, vh = innerHeight;
    const cy = (vh - 104.6) / 2;                                // ring centre, as in the CSS
    const topStart = document.querySelector('.bar').getBoundingClientRect().bottom + 32;   // under the header
    const botEnd = document.querySelector('.foot').getBoundingClientRect().top - 32;       // above the foot
    const bands = { top: cy - 12 - topStart, bot: botEnd - (cy + 12) };
    const probe = document.createElement('span');
    probe.className = 'title__line';
    probe.style.cssText = 'visibility:hidden;font-size:100px;left:0;top:0;transform:none';
    titleBox.appendChild(probe);
    for (const rec of titleEls.values()){
      for (const l of rec.lines){
        const pose = TUNNEL[l.where], tilt = pose.tilt * Math.PI / 180;
        probe.textContent = l.text;
        const widest = 100 * vw * 0.86 / probe.offsetWidth;      // never wider than 86% of the screen
        let size, stretch;
        if (l.where === 'top'){
          stretch = TUNNEL_STRETCH;
          size = Math.min(widest, Math.max(40, bands.top) / (0.72 * stretch * Math.cos(tilt)));
        } else {
          // The floor reaches up toward the orbs: pick the stretch that lands the tops of its
          // capitals just under the front orb. In perspective, capitals stretched to height H
          // rise H cos(t) * P / (P + H sin(t)) on screen; solving that for H gives the stretch.
          size = Math.min(widest, 260);
          const reach = botEnd - (cy + faceHalf * PERSP / (PERSP + R) - 8);
          const room = pose.persp * Math.cos(tilt) - reach * Math.sin(tilt);
          const tall = room > 0 ? reach * pose.persp / room : Infinity;
          stretch = Math.min(7, Math.max(TUNNEL_STRETCH, tall / (0.72 * size)));   // bounded: a longer stretch builds a layer too big to draw smoothly
        }
        l.node.style.fontSize = size.toFixed(1) + 'px';
        if (l.where === 'top'){ l.node.style.top = topStart + 'px'; l.node.style.bottom = ''; }
        else { l.node.style.bottom = (vh - botEnd) + 'px'; l.node.style.top = ''; }
        // the fixed pose: the ceiling leans its lower edge away, the floor its upper edge
        l.node.style.transform = 'translate(-50%,0) perspective(' + pose.persp + 'px) rotateX(' +
          (l.where === 'top' ? -pose.tilt : pose.tilt) + 'deg) scaleY(' + stretch.toFixed(3) + ')';
      }
      rec.drawn = '';                                            // rewrite opacity next frame
    }
    probe.remove();
  };
  layoutTitles();
  document.fonts.ready.then(layoutTitles);
  addEventListener('resize', layoutTitles, { passive: true });
  let prev = performance.now();

  (function frame(now){
    const dt = Math.min(Math.max((now - prev) / 1000, 0.0001), 0.05);
    prev = now;

    advance(spin, dt); advance(rad, dt); advance(tiltX, dt); advance(tiltY, dt);

    // Same maths as dirtverse's nested 3D: perspective and cursor tilt both
    // centred on the ring, then spin, then out to the rim, composed per slot
    // instead of by a 3D context.
    const head = 'perspective(' + PERSP + 'px) rotateX(' + tiltX.v.toFixed(3) +
                 'deg) rotateY(' + tiltY.v.toFixed(3) + 'deg) rotateY(';
    const tail = 'deg) translateZ(' + (-rad.v).toFixed(1) + 'px)';
    const edge = innerWidth / 2 + 40;          // slack for the cursor tilt

    for (let i = 0; i < N; i++){
      const deg = spin.v - i * STEP;
      const a = deg * Math.PI / 180;
      const d = PERSP + rad.v * Math.cos(a);   // distance in front of the camera
      depth[i] = d;
      const on = d > 60 && (Math.abs(Math.sin(a)) * rad.v - faceHalf) * PERSP / d < edge;
      if (on !== shown[i]){
        shown[i] = on;
        slots[i].style.visibility = on ? '' : 'hidden';
        const v = faces[i];
        if (v){
          v.dataset.culled = on ? '0' : '1';   // hidden videos pause: ten 1080p60 decodes is too many
          if (on) v.play().catch(() => {}); else v.pause();
        }
      }
      if (!on) continue;
      const tf = head + deg.toFixed(3) + tail;
      if (tf !== drawn[i]){
        slots[i].style.transform = tf;
        drawn[i] = tf;
      }
    }

    // Stacking, nearest on top, written only when the order actually changes.
    // A fresh z-index per moving frame re-stacks and repaints the whole ring;
    // the order itself only flips when two orbs pass each other.
    order.sort((p, q) => depth[q] - depth[p]);   // farthest first
    for (let k = 0; k < N; k++){
      const i = order[k];
      if (zDrawn[i] !== k){ slots[i].style.zIndex = k; zDrawn[i] = k; }
    }

    // Titles. Each is weighted by how near its orb is to dead front and simply
    // cross-fades where it stands: the tunnel lines never move, they only swap.
    const near = new Map();                        // title -> weight 0..1
    for (let i = 0; i < N; i++){
      const name = slotTitle[i];
      if (!name) continue;
      const off = ((spin.v - i * STEP) % 360 + 540) % 360 - 180;   // degrees from front
      const t = 1 - Math.abs(off) / (STEP * 0.75);                 // overlap the handover
      if (t > (near.get(name) || 0)) near.set(name, t);
    }
    // read out the front title only when it changes, never per frame
    let frontName = '', frontT = 0;
    for (const [name, t] of near) if (t > frontT){ frontT = t; frontName = name; }
    if (frontName && frontName !== announced){ announced = frontName; titleLive.textContent = frontName; }
    for (const [name, rec] of titleEls){
      const t = near.get(name) || 0;
      const o = t * t * (3 - 2 * t);                // smoothstep: no hard edges in the fade
      const key = o.toFixed(3);
      if (key === rec.drawn) continue;
      rec.drawn = key;
      rec.el.style.opacity = key;
    }

    requestAnimationFrame(frame);
  })(performance.now());
})();
</script>
