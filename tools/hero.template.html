<title>Five Worlds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&display=swap">

<style>
  :root{
    --paper:  #F5F4F2;
    --ink:    #0B0B0B;
    --pill:   #EAE8E5;
    --pill-in:#4A4844;
    --shadow: rgba(30,26,22,.22);
    /* the carousel, in one place */
    --radius: -1150px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0C0C0D; --ink:#F2F1EE; --pill:#1C1C1E; --pill-in:#A6A29C; --shadow:rgba(0,0,0,.62);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0C0C0D; --ink:#F2F1EE; --pill:#1C1C1E; --pill-in:#A6A29C; --shadow:rgba(0,0,0,.62);
  }

  *{ box-sizing:border-box; margin:0; padding:0 }
  html,body{ height:100% }
  body{ background:var(--paper); color:var(--ink);
        font-family:Archivo,system-ui,sans-serif; overflow:hidden }

  /* ---------- chrome ---------- */
  .bar{
    position:fixed; inset:0 0 auto 0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px; pointer-events:none;
  }
  .bar > *{ pointer-events:auto }
  .nav{ display:flex; gap:9px }
  .nav a,.contact{ font-size:14px; font-weight:500; text-decoration:none;
                   padding:7px 17px; border-radius:999px; white-space:nowrap }
  .nav a{ background:var(--pill); color:var(--pill-in) }
  .nav a:hover{ color:var(--ink) }
  .contact{ background:var(--ink); color:var(--paper) }
  .brand{ font-weight:900; font-size:19px; letter-spacing:-.05em }
  .nav a:focus-visible,.contact:focus-visible,.flow:focus-visible,.scene:focus-visible{
    outline:2px solid var(--ink); outline-offset:3px }

  /* ---------- the carousel ---------- */
  .scene{
    position:fixed; inset:0;
    perspective:850px; perspective-origin:50% 47%;
    touch-action:none; user-select:none; -webkit-user-select:none;
    cursor:grab; overflow:hidden;
  }
  .scene[data-drag="1"]{ cursor:grabbing }
  /* ring spins in place; the slots themselves carry the depth */
  .ring{
    position:absolute; left:50%; top:47%; width:0; height:0;
    /* orbs are background-image divs, immune to any img reset */
    transform-style:preserve-3d;
    transform:rotateY(0deg);   /* JS writes transform directly; a custom property forces a style recalc each frame */
    will-change:transform;
  }

  /* each slot: swung to its angle, then pushed out to the rim */
  .slot{
    position:absolute; left:0; top:0;
    transform-style:preserve-3d;
    transform:rotateY(calc(var(--i) * var(--step))) translateZ(var(--radius));
    /* promote each orb to its own compositor layer: without it the browser
       re-rasterises a 520px background image every frame as ring rotation
       changes its projected scale. Trade-off: slight softening at extreme scale. */
    will-change:transform;
  }
  .slot__f{ position:relative; animation:float var(--dur) var(--delay) ease-in-out infinite }
  @keyframes float{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-15px) } }

  .shade{ position:absolute; left:50%; bottom:-7%; transform:translateX(-50%);
          width:84%; height:20%; border-radius:50%; pointer-events:none;
          background:radial-gradient(closest-side, var(--shadow), transparent 72%) }

  .orbimg{
    width:520px; height:520px;
    margin:-260px 0 0 -260px;          /* centre the orb on its slot origin */
    background-size:contain; background-repeat:no-repeat; background-position:center;
    display:block; pointer-events:none; position:relative;
    backface-visibility:hidden;        /* far half of the ring drops out cleanly */
  }
{{IMGCSS}}
  body.flow .orbimg{ filter:var(--liq) }


  /* the ends of the carousel: a soft darkening that comes up as the cursor
     nears either edge, so the drift reads as intentional rather than a glitch */
  .edge{
    position:fixed; top:0; bottom:0; width:20vw; z-index:4;
    pointer-events:none; opacity:0; will-change:opacity;
  }
  .edge--l{ left:0;  background:linear-gradient(to right, rgba(11,11,11,.085), transparent 78%) }
  .edge--r{ right:0; background:linear-gradient(to left,  rgba(11,11,11,.085), transparent 78%) }

  .foot{
    position:fixed; left:0; right:0; bottom:18px; z-index:10;
    display:flex; justify-content:center; align-items:center; gap:14px;
    font-size:11px; font-weight:500; letter-spacing:.24em; text-transform:uppercase;
    color:var(--pill-in); pointer-events:none;
  }
  .flow{
    pointer-events:auto; cursor:pointer; font:inherit; letter-spacing:.14em;
    background:var(--pill); color:var(--pill-in); border:0;
    padding:7px 15px; border-radius:999px;
  }
  .flow[aria-pressed="true"]{ background:var(--ink); color:var(--paper) }

  @media (max-width:820px){
    :root{ --radius:-760px }
    .orbimg{ width:360px; height:360px; margin:-180px 0 0 -180px }
  }
  @media (max-width:700px){ .nav a,.contact{ font-size:13px; padding:6px 13px } .nav{ gap:6px } }
  @media (prefers-reduced-motion: reduce){
    .slot__f{ animation:none }
    body.flow .orbimg{ filter:none }
  }
</style>

<svg class="defs" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0"><defs>

    <feTurbulence type="fractalNoise" baseFrequency="0.0070 0.0060" numOctaves="2" seed="21" result="n">
      <animate attributeName="baseFrequency" dur="21s" repeatCount="indefinite"
               values="0.0070 0.0060;0.0048 0.0098;0.0070 0.0060"/>

    <feTurbulence type="fractalNoise" baseFrequency="0.0065 0.0105" numOctaves="2" seed="66" result="n">
      <animate attributeName="baseFrequency" dur="19s" repeatCount="indefinite"
               values="0.0065 0.0105;0.0105 0.0065;0.0065 0.0105"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" xChannelSelector="R" yChannelSelector="G" scale="14"/>
  </filter>
  <filter id="liq4" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0100 0.0085" numOctaves="2" seed="88" result="n">
      <animate attributeName="baseFrequency" dur="14s" repeatCount="indefinite"
               values="0.0100 0.0085;0.0070 0.0120;0.0100 0.0085"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" xChannelSelector="R" yChannelSelector="G" scale="12"/>

  <filter id="liq5" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0080 0.0095" numOctaves="2" seed="105" result="n">
      <animate attributeName="baseFrequency" dur="23s" repeatCount="indefinite"
               values="0.0080 0.0095;0.0115 0.0062;0.0080 0.0095"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" xChannelSelector="R" yChannelSelector="G" scale="10"/>

</defs></svg>

<header class="bar">
  <nav class="nav">
    <a href="#" onclick="return false">About</a>
    <a href="#" onclick="return false">Work</a>
    <a href="#" onclick="return false">Journal</a>
  </nav>
  <span class="brand">omada</span>
  <a class="contact" href="#" onclick="return false">Contact</a>
</header>

<div class="scene" id="scene" tabindex="0" role="group" aria-label="World carousel. Drag sideways, or use the left and right arrow keys.">
  <div class="ring" id="ring" style="--step:36deg">
{{SLOTS}}
  </div>
</div>

<div class="edge edge--l" id="edgeL" aria-hidden="true"></div>
<div class="edge edge--r" id="edgeR" aria-hidden="true"></div>

<div class="foot">
  <span>Drag to slide</span>
  <button class="flow" id="flow" type="button" aria-pressed="false">Flow: off</button>
</div>

<script>
(() => {
  const scene = document.getElementById('scene');
  const ring  = document.getElementById('ring');
  const flow  = document.getElementById('flow');
  const edgeL = document.getElementById('edgeL');
  const edgeR = document.getElementById('edgeR');
  const orbs  = [...document.querySelectorAll('.orbimg')];

  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;

  const setFlow = on => {
    document.body.classList.toggle('flow', on);
    flow.setAttribute('aria-pressed', String(on));
    flow.textContent = 'Flow: ' + (on ? 'on' : 'off');
    try { localStorage.setItem('flow', on ? '1' : '0'); } catch (e) {}
  };
  let initial = false;
  try { initial = localStorage.getItem('flow') === '1'; } catch (e) {}
  setFlow(initial);
  flow.addEventListener('click', () => setFlow(!document.body.classList.contains('flow')));

  const STEP = 36;

  // Negative: slots sit at a negative translateZ, so screen x = -R*sin(angle)
  // and a rising angle carries orbs LEFT. This sign is what makes them travel
  // with your hand rather than against it.
  const SENS       = -0.26;
  const STIFFNESS  = 90;
  const DAMPING    = 2 * Math.sqrt(90);
  const THROW_TIME = 0.16;
  const MAX_SLOTS  = 3;
  const VEL_WINDOW = 80;
  const MIN_DT     = 0.008;
  const MAX_VEL    = 1200;

  const EDGE_ZONE  = 0.20;   // outer fifth of the viewport counts as "near the end"
  const EDGE_SPEED = 52;     // deg/sec of drift at full strength
  const EDGE_EASE  = 5;      // how fast the drift ramps in and out
  const LEAN_REF   = 330;    // deg/sec that maps to a full lean
  const LEAN_ROT   = 7;      // degrees the orbs roll into the motion
  const LEAN_PULL  = 0.072;  // how much they stretch along travel
  const LEAN_EASE  = 9;

  let spin = 0, vel = 0, target = 0, drawn = null;
  let dragging = false, pointerX = 0, appliedX = 0, hoverX = null;
  let edge = 0, lean = 0, leanDrawn = null, settle = false;
  let history = [];
  let prev = performance.now();

  const applyPending = () => {
    const dx = pointerX - appliedX;
    if (!dx) return;
    appliedX = pointerX;
    spin += dx * SENS;
  };

  const flingVelocity = () => {
    if (history.length < 2) return 0;
    const last = history[history.length - 1];
    let first = history[0];
    for (const s of history) { if (last.t - s.t <= VEL_WINDOW) { first = s; break; } }
    const dt = Math.max((last.t - first.t) / 1000, MIN_DT);
    const v  = ((last.x - first.x) * SENS) / dt;
    return Math.max(-MAX_VEL, Math.min(MAX_VEL, v));
  };

  scene.addEventListener('pointerdown', e => {
    if (e.target.closest('.bar') || e.target.closest('.foot')) return;
    dragging = true; vel = 0;
    pointerX = appliedX = e.clientX;
    history = [{ x: e.clientX, t: performance.now() }];
    scene.setPointerCapture(e.pointerId);
    scene.dataset.drag = '1';
  });

  scene.addEventListener('pointermove', e => {
    hoverX = e.clientX;
    if (!dragging) return;
    pointerX = e.clientX;
    history.push({ x: e.clientX, t: performance.now() });
    if (history.length > 12) history.shift();
  });
  scene.addEventListener('pointerleave', () => { hoverX = null; });

  const release = e => {
    if (!dragging) return;
    applyPending();                       // before the target is chosen, always
    dragging = false; scene.dataset.drag = '0';
    vel = flingVelocity();
    const limit     = MAX_SLOTS * STEP;
    const projected = spin + Math.max(-limit, Math.min(limit, vel * THROW_TIME));
    target = Math.round(projected / STEP) * STEP;
    if (e && e.pointerId != null && scene.hasPointerCapture?.(e.pointerId))
      scene.releasePointerCapture(e.pointerId);
  };
  scene.addEventListener('pointerup', release);
  scene.addEventListener('pointercancel', release);
  scene.addEventListener('lostpointercapture', release);

  scene.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    target = Math.round(spin / STEP) * STEP + (e.key === 'ArrowRight' ? -STEP : STEP);
    e.preventDefault();
  });

  // signed 0..1 strength of "how near an end is the cursor", smoothstepped so
  // it has no hard boundary to cross
  const edgeTarget = () => {
    if (calm || !fine || dragging || hoverX == null) return 0;
    const w = innerWidth, z = w * EDGE_ZONE;
    let t = 0;
    if (hoverX < z)          t = -(1 - hoverX / z);
    else if (hoverX > w - z) t =  (1 - (w - hoverX) / z);
    const a = Math.abs(t);
    return Math.sign(t) * a * a * (3 - 2 * a);      // smoothstep
  };

  (function frame(now){
    const dt = Math.min(Math.max((now - prev) / 1000, 0.0001), 0.05);
    prev = now;

    // ease the edge strength itself, so entering and leaving the zone is a
    // ramp rather than a step
    edge += (edgeTarget() - edge) * Math.min(1, dt * EDGE_EASE);

    if (dragging){
      applyPending();
    } else if (Math.abs(edge) > 0.003){
      // drift while hovering an end. Target tracks spin so the snap spring
      // has nothing to pull against, and a settle is queued for when you leave.
      vel    = edge * EDGE_SPEED;
      spin  += vel * dt;
      target = spin;
      settle = true;
    } else {
      if (settle){ target = Math.round(spin / STEP) * STEP; settle = false; }
      const accel = -STIFFNESS * (spin - target) - DAMPING * vel;
      vel  += accel * dt;
      spin += vel * dt;
    }

    const next = spin.toFixed(3);
    if (next !== drawn){ ring.style.transform = 'rotateY(' + next + 'deg)'; drawn = next; }

    if (!calm){
      // orbs roll and stretch into the direction of travel, like something
      // being pulled through liquid. Eased separately so it trails the motion
      // slightly instead of snapping to it.
      const want = Math.max(-1, Math.min(1, vel / LEAN_REF));
      lean += (want - lean) * Math.min(1, dt * LEAN_EASE);
      const key = lean.toFixed(3);
      if (key !== leanDrawn){
        leanDrawn = key;
        const a  = Math.abs(lean);
        const t  = 'rotate(' + (-lean * LEAN_ROT).toFixed(2) + 'deg) scale(' +
                   (1 + a * LEAN_PULL).toFixed(4) + ',' + (1 - a * LEAN_PULL * 0.62).toFixed(4) + ')';
        for (const o of orbs) o.style.transform = t;
      }
      const el = edge < 0 ? -edge : 0, er = edge > 0 ? edge : 0;
      edgeL.style.opacity = el.toFixed(3);
      edgeR.style.opacity = er.toFixed(3);
    }

    requestAnimationFrame(frame);
  })(performance.now());
})();
</script>
