<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>render rig — booting</title>
<style>
  body{margin:0;background:#22242a;color:#9fe;font:13px monospace;padding:12px}
  #log{white-space:pre-wrap;line-height:1.6}
  #sheet{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;background:#EFEDE8;padding:12px;border-radius:8px}
  #sheet img{width:150px;height:150px}
</style>
</head>
<body>
<div id="log">booting…</div>
<div id="sheet"></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const log = m => { document.getElementById('log').textContent += '\n' + m; };
const SIZE = 1024;

// ---- ONE LIGHTING RIG, used for every object -----------------------
const renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true, preserveDrawingBuffer:true });
renderer.setSize(SIZE, SIZE);
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const pmrem = new THREE.PMREMGenerator(renderer);
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);

const scene = new THREE.Scene();
scene.environment = envRT.texture;
scene.background = null;

// consistent key light: upper-left, slightly front. Never changes.
const key = new THREE.DirectionalLight(0xffffff, 2.1); key.position.set(-4, 5, 4);
const fill = new THREE.DirectionalLight(0xffe9d6, 0.5); fill.position.set(4, -1, 2);
const rim  = new THREE.DirectionalLight(0xdCE6ff, 0.9); rim.position.set(2, 3, -5);
scene.add(key, fill, rim);

const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);

// ---- PALETTE -------------------------------------------------------
const C = {
  terracotta:'#C75B39', ink:'#1E2A5E', mustard:'#E0A526',
  sage:'#6E8B6B', charcoal:'#232323', ceramic:'#EDE4D6', clay:'#D98E7A'
};

const mat = (hex, o={}) => new THREE.MeshPhysicalMaterial({
  color:new THREE.Color(hex), roughness:o.rough ?? 0.28, metalness:o.metal ?? 0.0,
  clearcoat:o.clearcoat ?? 0.7, clearcoatRoughness:0.18, sheen:0.3,
  ...(o.transmission ? {transmission:o.transmission, thickness:1.4, ior:1.5} : {})
});

// deterministic wobble for the organic blob
function blobify(geo, amp, freq){
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    const n = Math.sin(v.x*freq)*Math.cos(v.y*freq*1.3)*Math.sin(v.z*freq*0.8);
    v.multiplyScalar(1 + n*amp);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

function helix(){
  const pts=[]; for(let i=0;i<=180;i++){const t=i/180*Math.PI*4;
    pts.push(new THREE.Vector3(Math.cos(t)*0.85, i/180*1.9-0.95, Math.sin(t)*0.85)); }
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 240, 0.19, 20, false);
}

// ---- THE SET -------------------------------------------------------
const SHAPES = [
  ['knot',    () => new THREE.TorusKnotGeometry(0.78,0.27,220,32),           C.terracotta, {}],
  ['blob',    () => blobify(new THREE.SphereGeometry(1,160,160),0.20,2.6),   C.ink,        {}],
  ['cube',    () => new RoundedBoxGeometry(1.5,1.5,1.5,8,0.34),              C.mustard,    {}],
  ['torus',   () => new THREE.TorusGeometry(0.85,0.33,64,180),               C.sage,       {}],
  ['capsule', () => new THREE.CapsuleGeometry(0.55,1.0,32,64),               C.clay,       {}],
  ['gem',     () => new THREE.IcosahedronGeometry(1.1,0),                    C.charcoal,   {rough:0.12,clearcoat:1}],
  ['drop',    () => blobify(new THREE.ConeGeometry(0.9,1.9,96,32),0.06,2.2), C.clay,       {rough:0.45,clearcoat:0.4}],
  ['helix',   helix,                                                          C.terracotta, {}],
  ['ring',    () => new THREE.TorusGeometry(1.0,0.12,48,200),                C.ink,        {rough:0.15,metal:0.35}],
  ['pill',    () => new RoundedBoxGeometry(2.0,0.7,0.7,8,0.34),              C.sage,       {}],
];

// fixed 3/4 view so every object is lit and framed identically
const DIR = new THREE.Vector3(0.55, 0.42, 1).normalize();

async function shoot(name, geoFn, color, opts){
  const mesh = new THREE.Mesh(geoFn(), mat(color, opts));
  mesh.rotation.set(0.32, 0.62, 0.12);
  scene.add(mesh);

  // frame consistently off the bounding sphere
  const box = new THREE.Box3().setFromObject(mesh);
  const sph = box.getBoundingSphere(new THREE.Sphere());
  const dist = sph.radius / Math.sin(THREE.MathUtils.degToRad(camera.fov*0.5)) * 0.66;   // bounding SPHERE of a BOX overshoots by ~sqrt(3); this claws the framing back
  camera.position.copy(sph.center).add(DIR.clone().multiplyScalar(dist));
  camera.lookAt(sph.center);
  camera.updateProjectionMatrix();

  renderer.render(scene, camera);

  const blob = await new Promise(r => renderer.domElement.toBlob(r, 'image/png'));
  await fetch('/save?name=' + name + '.png', { method:'POST', body: blob });

  const img = new Image(); img.src = URL.createObjectURL(blob);
  document.getElementById('sheet').appendChild(img);

  scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose();
  log('saved ' + name + '.png  (' + Math.round(blob.size/1024) + ' KB)');
}

log('three r' + THREE.REVISION + ' — rendering ' + SHAPES.length + ' shapes @ ' + SIZE + 'px');
for (const [n,g,c,o] of SHAPES) await shoot(n,g,c,o);
log('DONE');
document.title = 'DONE ' + SHAPES.length;
</script>
</body>
</html>
