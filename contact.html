<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Omada</title>
<meta name="description" content="Get in touch with Ejay Adamo (Omada), web developer in Toronto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">

<style>
  /* Same white world as the orb page: the contact page is the carousel's
     quiet sibling, not a new brand. Tokens mirror index.html. */
  :root{
    --paper:  #FFFFFF;
    --ink:    #0A0A0A;
    --pill:   #F0F0F0;
    --pill-in:#48484A;
    --muted:  #6B6B70;
    --line:   #E6E6E9;
  }

  *{ box-sizing:border-box; margin:0; padding:0 }
  html,body{ height:100% }
  body{ background:var(--paper); color:var(--ink);
        font-family:Archivo,system-ui,sans-serif;
        -webkit-font-smoothing:antialiased }

  /* ---------- chrome (copied from index.html) ---------- */
  .bar{
    position:fixed; inset:0 0 auto 0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px; pointer-events:none;
  }
  .bar > *{ pointer-events:auto }
  .nav{ display:flex; gap:9px }
  .nav a,.contact{ font-size:14px; font-weight:500; text-decoration:none;
                   padding:7px 17px; border-radius:999px; white-space:nowrap }
  .nav a{ background:var(--pill); color:var(--pill-in) }
  .nav a:hover{ color:var(--ink) }
  .contact{ background:var(--ink); color:var(--paper) }
  .brand{ font-weight:900; font-stretch:125%; font-size:19px; letter-spacing:-.04em; white-space:nowrap;
          position:absolute; left:50%; transform:translateX(-50%); color:var(--ink); text-decoration:none }
  .brand__first{ height:.95em; width:auto; vertical-align:-.2016em; margin-right:.28em }
  @media (max-width:820px){ .brand{ position:static; transform:none } }
  .nav a:focus-visible,.contact:focus-visible,.cta:focus-visible{
    outline:2px solid var(--ink); outline-offset:3px }

  /* ---------- the page ---------- */
  .page{
    min-height:100%;
    display:grid; grid-template-columns:minmax(0,1fr); place-items:center;
    padding:120px 20px 80px;
    overflow-x:hidden;
    text-align:center;
  }
  .wrap{ max-width:720px; width:100%; min-width:0 }
  .kicker{
    font-size:12px; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
    color:var(--muted); margin-bottom:22px;
  }
  h1{
    font-weight:900; font-stretch:112%; letter-spacing:-.04em; line-height:.98;
    font-size:clamp(40px, 8vw, 96px);
    margin-bottom:26px;
    overflow-wrap:anywhere;
  }
  h1 em{ font-style:normal; color:var(--muted) }
  .sub{
    font-size:18px; line-height:1.55; color:var(--muted);
    width:100%; max-width:520px; margin:0 auto 42px;
  }
  .cta-row{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center }
  .cta{
    display:inline-block; text-decoration:none; font-weight:600; font-size:16px;
    padding:15px 26px; border-radius:999px; white-space:nowrap;
    transition:transform .25s cubic-bezier(.2,.7,.2,1), background .25s ease, color .25s ease;
  }
  .cta:hover{ transform:translateY(-2px) }
  .cta--ink{ background:var(--ink); color:var(--paper) }
  .cta--line{ background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line) }
  .cta--line:hover{ box-shadow:inset 0 0 0 1.5px var(--ink) }
  .foot{
    margin-top:64px; padding-top:22px; border-top:1px solid var(--line);
    font-size:13px; color:var(--muted); letter-spacing:.02em;
  }

  /* arrive gently, like the about page's panels */
  .rise{ opacity:0; transform:translateY(14px);
         animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--n,0) * 90ms) }
  @keyframes rise{ to{ opacity:1; transform:none } }

  @media (max-width:700px){
    .nav a,.contact{ font-size:13px; padding:6px 13px } .nav{ gap:6px }
    /* two rows: wordmark on top, pills below, so nothing runs off the edge */
    .bar{ flex-wrap:wrap; padding:14px 16px; row-gap:10px }
    .brand{ order:-1; flex:0 0 100%; text-align:center }
    .page{ padding-top:130px }
    .sub{ font-size:16px }
    .cta{ width:100%; text-align:center; white-space:normal }
  }
  @media (prefers-reduced-motion: reduce){
    .rise{ animation:none; opacity:1; transform:none }
    .cta{ transition:none }
  }
</style>
</head>
<body>

<header class="bar">
  <nav class="nav" aria-label="Site">
    <a href="index.html">Orbs</a>
    <a href="about-me.html">About</a>
    <a href="#" onclick="return false">Work</a>
    <a href="#" onclick="return false">Journal</a>
  </nav>
  <a class="brand" href="index.html"><img class="brand__first" src="assets/intro/ejay-mark.png" alt="Ejay" width="1401" height="669">Adamo</a>
  <a class="contact" href="contact.html" aria-current="page">Contact</a>
</header>

<main class="page">
  <div class="wrap">
    <p class="kicker rise" style="--n:0">Get in touch</p>
    <h1 class="rise" style="--n:1">Have a project <em>in mind?</em></h1>
    <p class="sub rise" style="--n:2">
      Tell me what you're trying to get done and I'll tell you honestly whether I'm the
      right person for it, roughly what it takes, and how long it'll be.
    </p>
    <div class="cta-row rise" style="--n:3">
      <a class="cta cta--ink" href="mailto:omada008@gmail.com">omada008@gmail.com</a>
      <a class="cta cta--line" href="https://github.com/apparatus9" target="_blank" rel="noopener">GitHub ↗</a>
      <!-- To list a phone number, uncomment:
      <a class="cta cta--line" href="tel:+16470000000">(647) 000-0000</a>
      -->
    </div>
    <p class="foot rise" style="--n:4">Toronto, Canada</p>
  </div>
</main>

</body>
</html>
